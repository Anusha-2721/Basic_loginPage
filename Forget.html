<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Forget.css">
</head>

<body class="d-flex justify-content-center align-items-center" style="height:100vh">

    <div class="card login-card" style="width:500px">
        <div class="card-body text-center">

            <h1 class="mb-4">New Password Setup</h1>

            <form action="./index.html" class="text-start">

                <div class="mb-3">
                    <label for="NewPassword" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="NewPassword" required>
                </div>

                <div class="mb-3">
                    <label for="setPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="setPassword" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Submit
                </button>

            </form>

        </div>
    </div>

<script>
document.querySelector("form").addEventListener("submit", function (e) {
    let pass1 = document.getElementById("NewPassword").value;
    let pass2 = document.getElementById("setPassword").value;

    if (pass1 !== pass2) {
        e.preventDefault();
        alert("Passwords do not match!");
    }
});
</script>

</body>
</html>
