<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Post.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center" style="height:100vh";>
   <form action="" style="width:500px;" class="m-auto formDiv">
    <div class="mb-3">
        <label for="Posttitle" class="form-label">Post title</label>
        <input type="text" id="Posttitle" class="form-control" placeholder="title here">
    </div>
    <div class="mb-3">
        <label for="Describe" class="form-label">Description for your day special activities</label>
        <textarea class="form-control" id="Describe" rows="10"></textarea>
    </div>
    <button type="button" class="btn w-100" id="PostButton">Post my day</button>
   </form>
</body>
</html>
