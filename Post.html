<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Page</title>

    <link rel="stylesheet" href="Post.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center" style="height:100vh;">

<form style="width:500px;" class="m-auto formDiv" id="postForm">

    <div class="mb-3">
        <label for="Posttitle" class="form-label">Post Title</label>
        <input type="text" id="Posttitle" class="form-control" placeholder="title here" required>
    </div>

    <div class="mb-3">
        <label for="Describe" class="form-label">Description for your day special activities</label>
        <textarea class="form-control" id="Describe" rows="6" required></textarea>
    </div>

    <button type="button" class="btn btn-primary w-100" id="PostButton">
        Post my day
    </button>

</form>

</body>
</html>
