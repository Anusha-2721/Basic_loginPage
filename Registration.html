<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Registration.css">
</head>
<body class="d-flex justify-content-center align-items-center" style="height:100vh">
    <div class="card login-card" style="width:500px">
        <div class="card-body text-center">
            <h1 class="card-title">Welcome to Registration</h1>
            <p class="card-text">Please register to continue</p>
            <form action="" class="text-start" id="registrationForm">
                <div class="mb-3">
                    <label for="emailInput" class="form-label">Email Address</label><br>
                    <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" name="email">
                </div>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label"> Set Password</label><br>
                    <input type="password" class="form-control" id="passwordInput" name="password">
                </div>
                <p>Already having an account<a href="/index.html">Login here</a></p>
                <button type="submit" class="btn btn-primary w-100" id="RegisterButton">Register</button>
            </form>
            
            <script>
                const form=document.getElementById('registrationForm');
                form.addEventListener('submit',async(e)=>{
                    e.preventDefault();
                    alert("Button clicked");
                    try{
                    const formData=new URLSearchParams(new FormData(form));
                    const response=await fetch('http://localhost:3000/registerUser',{
                        method:'POST',
                        headers:{
                            'content-type':'application/x-www-form-urlencoded'
                        },
                        body:formData
                    });
                    const data=await response.json();
                    alert(data.message);
                }catch(err){
                    console.log(err);
                    alert('err.message');

                }
                });
            </script>
        </div>
    </div>
</body>
</html>
