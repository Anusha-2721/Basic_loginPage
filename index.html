<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Login.css">
</head>
<body class="d-flex justify-content-center align-items-center style="height:100vh">
    <div class="card login-card" style="width:500px">
        <div class="card-body text-center">
            <h1 class="card-title">Welcome</h1>
            <p class="card-text">Please login to continue</p>
            <form action="" class="text-start">
                <div class="mb-3">
                    <label for="emailInput" class="form-label">Email Address</label><br>
                    <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label">Password</label><br>
                    <input type="password" class="form-control" id="passwordInput">
                </div>
                <p>Do you have an account?<a href="/Registration.html">Register here</a></p>
                <a href="/Forget.html">Forget Password</a>
            </form>
            <a  href="/FeedPage.html" class="btn btn-primary w-100" id="LoginButton">Login</a>
        </div>
    </div>
</body>
</html>
